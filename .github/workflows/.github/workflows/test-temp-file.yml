name: Test Temporal File with Git Push

on:
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write # Permite que la Action haga push al repositorio

jobs:
  generate-and-push-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Crear archivo temporal y hacer Git Push
        run: |
          # 1. Crear carpeta y manifiesto vulnerable
          mkdir -p temp-git-tracked
          echo '{"name":"temp-tracked-app","version":"1.0.0","dependencies":{"lodash":"4.17.15"}}' > temp-git-tracked/package.json
          
          # 2. Configurar usuario de Git para el commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 3. Agregar, commitear y subir a Git
          git add temp-git-tracked/package.json
          git commit -m "chore(ci): subir manifiesto temporal desde pipeline"
          git push origin main
